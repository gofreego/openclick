apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclick
  labels:
    app: openclick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclick
  template:
    metadata:
      labels:
        app: openclick
    spec:
      containers:
        - name: openclick
          image: ghcr.io/gofreego/openclick:pilot-3a07794
          imagePullPolicy: Always
          command:
            - /app/application
          args:
            - -env=prod
            - -path=/etc/openclick/config
          ports:
            - name: http
              containerPort: 80
            - name: grpc
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/openclick/config
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          secret:
            # Created out-of-band from the private configs-prod repo, not by
            # anything in this repo's own manifests - see infra's
            # openclick-config-secret role.
            secretName: openclick-config
